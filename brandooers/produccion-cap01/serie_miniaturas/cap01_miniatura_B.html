<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Capítulo 1 · miniatura B</title>
<style>
@font-face{font-family:"Anton";src:url("assets/Anton.ttf")}
@font-face{font-family:"Inter";src:url("assets/Inter.ttf");font-weight:100 900}
@font-face{font-family:"Caveat";src:url("assets/Caveat.ttf");font-weight:400 700}
@font-face{font-family:"Space Grotesk";src:url("assets/SpaceGroteskBD.ttf");font-weight:700}
:root{--k:#0b0918;--k2:#12102a;--w:#fff;--p:#EC4899;--c:#00D4FF;--v:#8B5CF6;--m:#b9b0d6;
  --grad:linear-gradient(120deg,#00D4FF,#8B5CF6,#EC4899)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:var(--k)}
.stage{position:absolute;inset:0;overflow:hidden;background:var(--k)}
.ph{position:absolute;display:block}
.logo{display:inline-flex;align-items:center;gap:.1em;font-family:"Inter";font-weight:900;line-height:1;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.logo .beyes{width:1.269em;height:auto;margin:0 .02em;overflow:visible}
.logo .ide{font-family:"Caveat";font-weight:700;font-size:1.05em;color:#67E8F9;margin-right:.22em;transform:translateY(.04em)}
.dark .logo{color:#0b0918} .dark .logo .ide{color:#0891B2}
.blk{display:inline-block;font-family:"Anton";line-height:1.04;white-space:nowrap;padding:.06em .14em 0}
.p{background:var(--p);color:var(--k)} .c{background:var(--c);color:var(--k)} .w{background:#fff;color:var(--k)}
.cav{font-family:"Caveat";font-weight:700;color:var(--w)}
.sg{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.02em}
.gtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
html,body{width:1280px;height:720px}
.glow{position:absolute;inset:0;background:
  radial-gradient(520px 520px at 965px 330px,rgba(139,92,246,.55),transparent 70%),
  radial-gradient(420px 420px at 1240px 700px,rgba(236,72,153,.35),transparent 70%),
  radial-gradient(460px 460px at 760px 40px,rgba(0,212,255,.22),transparent 70%)}
.top{position:absolute;left:56px;top:44px;display:flex;align-items:center;gap:16px}
.serie{font-size:25px;color:#fff;padding:10px 18px 9px;border-radius:999px;background:var(--grad);letter-spacing:.01em}
.cap{font-size:44px}
.hook{position:absolute;left:56px;font-family:"Anton";color:#fff;text-transform:uppercase;line-height:.98;text-wrap:balance}
.lockup{position:absolute;left:56px;bottom:40px;font-size:30px}
.sub{position:absolute;left:56px}

.glow{background:radial-gradient(560px 560px at 990px 360px,rgba(236,72,153,.45),transparent 70%),
  radial-gradient(460px 460px at 760px 60px,rgba(139,92,246,.35),transparent 70%)}
.hook{top:130px;width:620px;height:300px}
.hl{background:var(--p);color:var(--k);padding:0 .12em;display:inline-block;line-height:1;margin-top:.04em}
.sub{top:452px;width:610px;font:600 24px/1.2 "Inter";color:var(--m)}
.chain{position:absolute;left:56px;top:500px;width:600px;height:110px}
.chain .st{position:absolute;top:0;width:126px;text-align:center}
.chain .n{display:block;margin:0 auto 10px;width:62px;height:62px;border-radius:50%;background:#fff;color:var(--k);
  font:400 40px/62px "Anton"}
.chain .t{font:700 17px/1 "Space Grotesk";color:#fff;letter-spacing:.02em}
.chain .ln{position:absolute;top:29px;height:5px;background:#fff}
.chain svg{position:absolute;left:222px;top:-6px}
</style></head>
<body>
<div class="stage">
<div class="glow"></div>
<img class="ph" src="assets/mascota_search.jpg" alt="" style="left:580px;top:0px;width:700px;height:720px;object-fit:cover;object-position:50% 35%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 25%);-webkit-mask-composite:source-in">
<div class="top"><span class="serie sg">TU TIENDA VENDE MÁS</span><span class="blk c cap">CAPÍTULO 1</span></div>
<div class="hook" data-fit="160" data-min="90">¿POR QUÉ NO <span class="hl">VENDE?</span></div>
<div class="sub"><span>Los 4 pasos donde se rompe la venta</span></div>
<div class="chain"><div class="st" style="left:0px"><span class="n">1</span><span class="t">ENCONTRAR</span></div><div class="st" style="left:158px"><span class="n">2</span><span class="t">ENTENDER</span></div><div class="st" style="left:316px"><span class="n">3</span><span class="t">COMPRAR</span></div><div class="st" style="left:474px"><span class="n">4</span><span class="t">PAGAR</span></div><i class="ln" style="left:94px;width:96px"></i><i class="ln" style="left:410px;width:96px"></i><i class="ln" style="left:252px;width:26px"></i><i class="ln" style="left:322px;width:26px"></i><svg width="150" height="76" viewBox="0 0 150 76"><path d="M62 4 L84 30 L66 40 L90 72" fill="none" stroke="#EC4899" stroke-width="9" stroke-linejoin="miter" stroke-linecap="square"/></svg></div>
<div class="lockup"><span class="logo"><span class="ide">SkillUp</span>Brand<svg class="beyes" viewBox="0 0 100 58" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#0891B2"/></linearGradient><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0891B2"/><stop offset="100%" stop-color="#E4A900"/></linearGradient><radialGradient id="ir1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#6D28D9"/></radialGradient><radialGradient id="ir2"><stop offset="0%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/></radialGradient></defs><g><ellipse cx="25" cy="36" rx="18" ry="18" fill="none" stroke="url(#bg1)" stroke-width="3"/><circle cx="25" cy="36" r="7.5" fill="url(#ir1)"/><circle cx="25" cy="36" r="3.4" fill="#0a0a12"/><circle cx="28" cy="33" r="1.8" fill="#fff"/></g><g><ellipse cx="73" cy="36" rx="18" ry="18" fill="none" stroke="url(#bg2)" stroke-width="3"/><circle cx="73" cy="36" r="7.5" fill="url(#ir2)"/><circle cx="73" cy="36" r="3.4" fill="#0a0a12"/><circle cx="76" cy="33" r="1.8" fill="#fff"/></g></svg>ers</span></div>
</div>
<script>
document.fonts.ready.then(() => {
  for (const el of document.querySelectorAll('[data-fit]')) {
    let s = parseFloat(el.dataset.fit), min = parseFloat(el.dataset.min || 10);
    el.style.fontSize = s + 'px';
    while (s > min && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1)) { s -= 2; el.style.fontSize = s + 'px'; }
    el.dataset.final = s;
  }
  window.__fitted = true;
});
</script>
</body></html>
